name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  xcheck:
    name: independent vector cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only until the K0 vectors land; the re-derivation dependencies
      # arrive with xcheck/requirements.txt at that point.
      - name: Cross-check golden vectors
        run: python3 xcheck/run.py spec/vectors

  # Placeholder: the TypeScript re-deriver (K0 spec half) is the second
  # independent cross-check. The job goes green-with-a-note until
  # tscheck/package.json exists, then runs the real suite.
  tscheck:
    name: typescript vector cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check golden vectors (TypeScript)
        run: |
          if [ -f tscheck/package.json ]; then
            npm ci --prefix tscheck
            npm test --prefix tscheck
          else
            echo "tscheck/ not present yet — it lands with the K0 vectors"
          fi

  # C1 family-substrate vectors: every repo's CI re-derives the shared
  # vectors independently. Pinned via plan/family-lock.json row
  # 'family-vectors-c1-r3' (byom tag c1-r3); bump follows the D3 choreography.
  family-vectors:
    name: family-vectors cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer
      - uses: actions/checkout@v4
        with:
          repository: zarbafian/byom
          ref: b3a8f4ad96c6992e029080faec93837a1fedeb40
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify this ref is the one the family lock pins
        run: |
          # R3-L03: CI must check the locked manifest, not merely carry a ref
          # that someone remembered to bump. The vendored pin holds the
          # manifest digest; the manifest holds the tree's commit.
          pin_sha=$(python3 -c "import json;print(json.load(open('consumer/spec/family-lock.pin.json'))['manifest_sha256'])")
          echo "vendored pin expects manifest sha256 $pin_sha"
          # This constant is a second copy of the family manifest digest. The
          # program's plan/check-dag.py asserts it equals the manifest, so a
          # re-pin that forgets this file fails there rather than here.
          test "$pin_sha" = "24d6130b802e767f2f1334c40a5ca184f4bf4a37e7637e877282f68cd6534369" || { echo "manifest digest drifted from this repo's vendored pin"; exit 1; }
          test "$(git rev-parse HEAD)" = "b3a8f4ad96c6992e029080faec93837a1fedeb40" || { echo "checked-out byom tree is not the locked commit"; exit 1; }
      - run: python3 family-vectors/xcheck.py
