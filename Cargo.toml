[workspace]
resolver = "2"
members = [
    "crates/kovee-core",
    "crates/kovee-store",
    "crates/kovee-auth",
    "crates/kovee-space",
    "crates/kovee-attention",
    "crates/kovee-commitment",
    "crates/kovee-runtime",
    "crates/kovee-effects",
    "crates/kovee-artifacts",
    "crates/kovee-bus",
    "crates/kovee-byom",
    "crates/kovee-akson",
    "crates/koveed",
    "crates/kovee-cli",
    "crates/kovee-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zarbafian/kovee"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
kovee-core = { path = "crates/kovee-core" }
kovee-store = { path = "crates/kovee-store" }
kovee-auth = { path = "crates/kovee-auth" }
kovee-space = { path = "crates/kovee-space" }
kovee-attention = { path = "crates/kovee-attention" }
kovee-commitment = { path = "crates/kovee-commitment" }
kovee-runtime = { path = "crates/kovee-runtime" }
kovee-effects = { path = "crates/kovee-effects" }
kovee-artifacts = { path = "crates/kovee-artifacts" }
kovee-bus = { path = "crates/kovee-bus" }
kovee-byom = { path = "crates/kovee-byom" }
kovee-akson = { path = "crates/kovee-akson" }
koveed = { path = "crates/koveed" }

# External (pinned minor versions; exact pins live in Cargo.lock, committed).
# Additions follow akson's convention: pinned here, policy enforced by
# cargo-deny.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `bundled` compiles the vendored SQLite: pure-Rust-workspace build posture
# (no system library probing, no network at build time) — akson's choice.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2.0"
libc = "0.2"
# TLS 1.3 egress for the model broker (§16.3 step 5). akson's ADR-0011
# stack, and for the same reason: rustls with the pure-Rust
# `rustls-rustcrypto` provider keeps the workspace free of C toolchains and
# system-library probing, and the Mozilla root bundle is compiled in rather
# than read from an ambient filesystem trust store. Synchronous
# (`rustls::StreamOwned` over `std::net::TcpStream`) because koveed is a
# thread-per-connection daemon with no async runtime.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = [
    "std",
] }
rustls-pki-types = "1"
webpki-roots = "0.26"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
