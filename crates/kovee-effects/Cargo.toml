[package]
name = "kovee-effects"
publish = false
description = "Policy revisions/ceilings, intents, decisions, model/tool/connector brokers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The test-only surface: the recording transport, the in-memory spent ledger,
# and the plan-rebuilding probe helper. A production build never enables it,
# so no `Transport` a test wrote can reach `dispatch` there (R3-B02).
testing = []

[dependencies]
kovee-core = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-rustcrypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
webpki-roots = { workspace = true }
