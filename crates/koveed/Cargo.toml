[package]
name = "koveed"
publish = false
description = "The Kovee daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "koveed"
path = "src/lib.rs"

[[bin]]
name = "koveed"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kovee-core = { workspace = true }
kovee-artifacts = { workspace = true }
kovee-byom = { workspace = true }
kovee-effects = { workspace = true }
kovee-store = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The recording transport and the in-memory spent ledger live behind
# kovee-effects' `testing` feature, so the K2 suites can prove "zero sends"
# while a production build of this daemon has no such wire to offer (R3-B02).
kovee-effects = { workspace = true, features = ["testing"] }
# koveed's own `testing` feature, ON for the test targets and only for them
# (R3-I02). `#[cfg(test)]` covers the lib's unit tests; an integration test in
# `tests/` links the library as an ordinary dependency, so without this the
# daemon's recording-egress builder would not exist for the suite that has to
# exercise it — which is exactly how it came to be dead code.
koveed = { path = ".", features = ["testing"] }
sha2 = { workspace = true }
[features]
# A test-built daemon can serve its real operations over a no-network wire
# (R3-I02). Production builds must NOT enable this: the seal is that the
# recording transport and the daemon's egress override are not compiled at all.
testing = ["kovee-effects/testing"]
